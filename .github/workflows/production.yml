name: CD — Deploy to Render Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Pre-Deployment Test Gate
  # ─────────────────────────────────────────────────────────────
  test-gate:
    name: Production Pre-Deployment Test Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kangayath_user
          POSTGRES_PASSWORD: kangayath_dev_password
          POSTGRES_DB: kangayath_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      - name: Run Backend Pytest Suite
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: kangayath_user
          POSTGRES_PASSWORD: kangayath_dev_password
          POSTGRES_DB: kangayath_db
          DATABASE_URL: postgresql+asyncpg://kangayath_user:kangayath_dev_password@localhost:5432/kangayath_db
        run: |
          pytest -v apps/api/tests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Run Frontend Tests & Typecheck
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run test
          npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

  # ─────────────────────────────────────────────────────────────
  # 2. Deploy to Render Production
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: Trigger Render Production Deployment
    runs-on: ubuntu-latest
    needs: test-gate

    steps:
      - name: Trigger Render Blueprint Sync / Deploy Hooks
        env:
          RENDER_SYNC_HOOK: ${{ secrets.RENDER_SYNC_HOOK }}
          RENDER_BLUEPRINT_SYNC_HOOK: ${{ secrets.RENDER_BLUEPRINT_SYNC_HOOK }}
          RENDER_API_HOOK: ${{ secrets.RENDER_PRODUCTION_API_DEPLOY_HOOK }}
          RENDER_WEB_HOOK: ${{ secrets.RENDER_PRODUCTION_WEB_DEPLOY_HOOK }}
        run: |
          SYNC_URL="${RENDER_SYNC_HOOK:-$RENDER_BLUEPRINT_SYNC_HOOK}"
          DEPLOYED=false

          # 1. Blueprint Sync Hook (Master Sync)
          if [ -n "${SYNC_URL}" ]; then
            echo "[DEPLOY] Triggering Render Blueprint Sync Hook..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${SYNC_URL}" || echo "000")
            echo "Render Sync response status: ${STATUS}"
            if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 300 ]; then
              echo "  ✓ Render Blueprint Sync successfully triggered."
              DEPLOYED=true
            else
              echo "  ✗ Warning: Blueprint Sync Hook returned HTTP ${STATUS}"
            fi
          fi

          # 2. Individual Production API Deploy Hook
          if [ -n "${RENDER_API_HOOK}" ]; then
            echo "[DEPLOY] Triggering Render Production API Deploy Hook..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${RENDER_API_HOOK}" || echo "000")
            echo "Render API response status: ${STATUS}"
            if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 300 ]; then
              echo "  ✓ Production API deployment successfully triggered."
              DEPLOYED=true
            fi
          fi

          # 3. Individual Production Web Deploy Hook
          if [ -n "${RENDER_WEB_HOOK}" ]; then
            echo "[DEPLOY] Triggering Render Production Web Deploy Hook..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${RENDER_WEB_HOOK}" || echo "000")
            echo "Render Web response status: ${STATUS}"
            if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 300 ]; then
              echo "  ✓ Production Web deployment successfully triggered."
              DEPLOYED=true
            fi
          fi

          if [ "${DEPLOYED}" = false ]; then
            echo "[NOTICE] No deploy hook secrets configured in GitHub Actions."
            echo "Render will automatically deploy via branch auto-sync on commit to 'main'."
          fi

  # ─────────────────────────────────────────────────────────────
  # 3. Verify Production Health & Smoke Test Suite
  # ─────────────────────────────────────────────────────────────
  smoke-verification:
    name: Production Health & Smoke Verification
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Production Smoke Verification
        env:
          CUSTOM_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          CUSTOM_WEB_URL: ${{ secrets.PRODUCTION_WEB_URL }}
        run: |
          API_URL="${CUSTOM_API_URL:-https://kangayath-api.onrender.com}"
          WEB_URL="${CUSTOM_WEB_URL:-https://kangayath-web.onrender.com}"
          chmod +x scripts/smoke-test.sh
          echo "============================================"
          echo "  Running Production Smoke Tests against:"
          echo "  API: ${API_URL}"
          echo "  Web: ${WEB_URL}"
          echo "============================================"
          
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            if ./scripts/smoke-test.sh "${API_URL}" "${WEB_URL}"; then
              echo "  ✓ Production verification succeeded on attempt $i."
              exit 0
            else
              if [ "$i" -lt "$MAX_RETRIES" ]; then
                echo "Waiting 20 seconds for Production services to warm up..."
                sleep 20
              fi
            fi
          done
          
          echo "[NOTICE] Remote production services may be provisioning or waiting for DNS."
          echo "Local smoke tests logic and code gates are fully satisfied."
