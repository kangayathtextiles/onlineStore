# ==============================================================================
# KANGAYATH WEB — Nginx Reverse Proxy Configuration
# ==============================================================================
# This serves as the single entry point for all external traffic.
# Routes:
#   /          → Next.js Frontend (port 3000)
#   /admin/    → Next.js Frontend (port 3000)
#   /api/      → FastAPI Backend  (port 8000)
#   /health    → FastAPI Backend  (port 8000)
# ==============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

    # Upstream backends
    upstream api_backend {
        server api:8000;
    }

    upstream web_frontend {
        server web:3000;
    }

    # --- HTTP Server (redirect to HTTPS in production) ---
    server {
        listen 80;
        server_name _;

        # Uncomment for HTTPS redirect in production:
        # return 301 https://$host$request_uri;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

        # Client body size limit (for image uploads)
        client_max_body_size 10M;

        # --- API routes ---
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # --- Health probe (direct to API) ---
        location /health {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- API docs (development only — blocked in production) ---
        location /docs {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # --- Static assets (Next.js) ---
        location /_next/static/ {
            limit_req zone=general_limit burst=100 nodelay;

            proxy_pass http://web_frontend;
            proxy_set_header Host $host;

            # Cache static assets aggressively
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # --- All other routes → Next.js Frontend ---
        location / {
            limit_req zone=general_limit burst=100 nodelay;

            proxy_pass http://web_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
    }

    # --- HTTPS Server (uncomment when TLS certificates are available) ---
    # server {
    #     listen 443 ssl http2;
    #     server_name kangayath.in www.kangayath.in;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #
    #     # Include the same location blocks as HTTP server above
    # }
}
