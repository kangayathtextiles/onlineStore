# ==============================================================================
# KANGAYATH WEB — Production Docker Compose
# ==============================================================================
# Usage: docker compose -f docker-compose.production.yml up -d
#
# IMPORTANT: Set all environment variables via .env file or shell environment.
# NEVER commit production credentials to version control.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: kangayath-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kangayath-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: kangayath-api
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-https://kangayath.in}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      MEDIA_ROOT: /app/media
    ports:
      - "${API_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kangayath-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.kangayath.in}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kangayath.in}
    container_name: kangayath-web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.kangayath.in}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kangayath.in}
    ports:
      - "${WEB_EXTERNAL_PORT:-3000}:3000"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - kangayath-network

  nginx:
    image: nginx:alpine
    container_name: kangayath-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount TLS certificates when available:
      # - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - kangayath-network

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local

networks:
  kangayath-network:
    driver: bridge
