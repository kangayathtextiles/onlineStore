# ==============================================================================
# KANGAYATH WEB — Production Docker Compose
# ==============================================================================
# Usage: docker compose -f docker-compose.production.yml up -d
#
# IMPORTANT: Set all environment variables via .env file or shell environment.
# NEVER commit production credentials to version control.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: kangayath-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # Secure database port: bind strictly to localhost (127.0.0.1) to prevent public internet access.
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kangayath-network

  migration:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: kangayath-migration
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required (min 32 characters)}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-supabase}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required for production storage}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required for production storage}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-product-media}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kangayath-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: kangayath-api
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required (min 32 characters)}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-https://kangayath.site,https://www.kangayath.site}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      MEDIA_ROOT: /app/media
      SITE_URL: ${SITE_URL:-https://kangayath.site}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-supabase}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required for production storage}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required for production storage}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-product-media}
    # Prevent bypassing Nginx: bind strictly to localhost (127.0.0.1) for local host access only.
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kangayath-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.kangayath.site}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kangayath.site}
    container_name: kangayath-web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.kangayath.site}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kangayath.site}
    # Prevent bypassing Nginx: bind strictly to localhost (127.0.0.1) for local host access only.
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_EXTERNAL_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - kangayath-network

  nginx:
    image: nginx:alpine
    container_name: kangayath-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - kangayath-network

  certbot:
    image: certbot/certbot:latest
    container_name: kangayath-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_certs:/etc/letsencrypt:rw
      - ./infrastructure/nginx/certs:/etc/nginx/certs:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - kangayath-network

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  certbot_www:
    driver: local
  certbot_certs:
    driver: local

networks:
  kangayath-network:
    driver: bridge
