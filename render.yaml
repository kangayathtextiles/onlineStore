databases:
  - name: kangayath-db
    plan: free
    databaseName: kangayath_db
    user: kangayath_user

services:
  # ──────────────────────────────────────────────
  # 1. FastAPI Backend API
  # ──────────────────────────────────────────────
  - type: web
    name: kangayath-api
    plan: free
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kangayath-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "https://kangayath-web.onrender.com"
      - key: MEDIA_ROOT
        value: /app/media
      - key: SITE_URL
        value: https://kangayath-web.onrender.com
      - key: LOG_LEVEL
        value: INFO

  # ──────────────────────────────────────────────
  # 2. Next.js Frontend (Customer + Admin)
  # ──────────────────────────────────────────────
  - type: web
    name: kangayath-web
    plan: free
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    dockerBuildArgs:
      - NEXT_PUBLIC_API_URL=https://kangayath-api.onrender.com
      - NEXT_PUBLIC_SITE_URL=https://kangayath-web.onrender.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://kangayath-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kangayath-web.onrender.com
