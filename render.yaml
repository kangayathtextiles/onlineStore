services:
  # ──────────────────────────────────────────────
  # 1. Production FastAPI Backend API (Branch: main)
  # ──────────────────────────────────────────────
  - type: web
    name: kangayath-api
    branch: main
    plan: free
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: "https://kangayath-web.onrender.com"
      - key: MEDIA_ROOT
        value: /app/media
      - key: SITE_URL
        value: https://kangayath-web.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: product-media

  # ──────────────────────────────────────────────
  # 2. Production Next.js Frontend (Branch: main)
  # ──────────────────────────────────────────────
  - type: web
    name: kangayath-web
    branch: main
    plan: free
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://kangayath-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kangayath-web.onrender.com

  # ──────────────────────────────────────────────
  # 3. Staging FastAPI Backend API (Branch: staging)
  # ──────────────────────────────────────────────
  - type: web
    name: kangayath-api-staging
    branch: staging
    plan: free
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: "https://kangayath-web-staging.onrender.com"
      - key: MEDIA_ROOT
        value: /app/media
      - key: SITE_URL
        value: https://kangayath-web-staging.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: product-media

  # ──────────────────────────────────────────────
  # 4. Staging Next.js Frontend (Branch: staging)
  # ──────────────────────────────────────────────
  - type: web
    name: kangayath-web-staging
    branch: staging
    plan: free
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://kangayath-api-staging.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kangayath-web-staging.onrender.com
