databases:
  # ──────────────────────────────────────────────
  # 1. Production PostgreSQL Database (Existing)
  # ──────────────────────────────────────────────
  - name: kangayath-db
    plan: free
    databaseName: kangayath_db
    user: kangayath_user

  # ──────────────────────────────────────────────
  # 2. Staging PostgreSQL Database (New)
  # ──────────────────────────────────────────────
  - name: kangayath-db-staging
    plan: free
    databaseName: kangayath_db_staging
    user: kangayath_user_staging

services:
  # ──────────────────────────────────────────────
  # 1. Production FastAPI Backend API (Branch: main)
  # ──────────────────────────────────────────────
  - type: web
    name: kangayath-api
    branch: main
    plan: free
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kangayath-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "https://kangayath-web.onrender.com"
      - key: MEDIA_ROOT
        value: /app/media
      - key: SITE_URL
        value: https://kangayath-web.onrender.com
      - key: LOG_LEVEL
        value: INFO

  # ──────────────────────────────────────────────
  # 2. Production Next.js Frontend (Branch: main)
  # ──────────────────────────────────────────────
  - type: web
    name: kangayath-web
    branch: main
    plan: free
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://kangayath-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kangayath-web.onrender.com

  # ──────────────────────────────────────────────
  # 3. Staging FastAPI Backend API (Branch: staging)
  # ──────────────────────────────────────────────
  - type: web
    name: kangayath-api-staging
    branch: staging
    plan: free
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kangayath-db-staging
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "https://kangayath-web-staging.onrender.com"
      - key: MEDIA_ROOT
        value: /app/media
      - key: SITE_URL
        value: https://kangayath-web-staging.onrender.com
      - key: LOG_LEVEL
        value: INFO

  # ──────────────────────────────────────────────
  # 4. Staging Next.js Frontend (Branch: staging)
  # ──────────────────────────────────────────────
  - type: web
    name: kangayath-web-staging
    branch: staging
    plan: free
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://kangayath-api-staging.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kangayath-web-staging.onrender.com
