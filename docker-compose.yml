services:
  postgres:
    image: postgres:16-alpine
    container_name: kangayath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kangayath_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kangayath_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kangayath_db}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kangayath_user} -d ${POSTGRES_DB:-kangayath_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: kangayath-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-kangayath_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kangayath_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kangayath_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kangayath_user}:${POSTGRES_PASSWORD:-kangayath_dev_password}@postgres:5432/${POSTGRES_DB:-kangayath_db}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: kangayath-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
